# Simulation defaults shared by both apps.
# Consumed by libs/config/simulation_defaults.py::SimulationDefaults.

[defaults]
seed                 = 42
residues_per_segment = 20
max_angle_hinge      = 1.5707963     # pi/2
max_angle_pivot      = 3.14159265    # pi
sample_interval      = 5
move_size            = 20
n_small_steps        = 100           # MC sweeps between bond rescalings; 0 disables

[rand_pool]
initial_size   = 10000
expansion_size = 5000

[bond]
tolerance = 0.05

[validation_matrix]     # T1-T7 validation matrix (superset of benchmark matrix)
chain_lengths = [25, 50, 100, 250, 500]
phi_values    = [0.001, 0.01, 0.05, 0.10, 0.20, 0.30]
