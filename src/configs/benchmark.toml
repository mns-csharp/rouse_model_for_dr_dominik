# Benchmark matrix, schedules, and cell defaults for apps/benchmark.
# All values consumed by libs/config/benchmark_matrix.py::BenchmarkMatrix.

[matrix]
chain_lengths = [25, 50, 100]
phi_values    = [0.035]
algorithms    = ["conventional", "multistep"]
devices       = ["cpu", "gpu"]

[sweep_schedule]         # Benchmark protocol Section 8 (abbreviated)
"25"  = { eq = 2000,  prod = 1000 }
"50"  = { eq = 5000,  prod = 2000 }
"100" = { eq = 10000, prod = 5000 }

[timing_sweep_schedule]  # reduced schedule for wall-clock timing
"25"  = { eq = 30, prod = 50  }
"50"  = { eq = 50, prod = 80  }
"100" = { eq = 80, prod = 120 }

[cell_defaults]
n_chains      = 300
phi           = 0.10
warmup_sweeps = 10
repeats       = 1

[pe1]  # segment-size pre-experiment
N              = 50
n_chains       = 300
eq_sweeps      = 500
prod_sweeps    = 500
candidates     = [4, 8, 16, 20, 32, 64]

[pe2]  # hinge-angle pre-experiment (radians)
N              = 50
n_chains       = 300
eq_sweeps      = 500
prod_sweeps    = 500
candidates_rad = [0.39269908, 0.78539816, 1.04719755, 1.57079633, 2.09439510, 3.14159265]

[pe3]  # batch-size pre-experiment (M = multistep parallel proposals)
n_chains       = 300
eq_sweeps      = 200
prod_sweeps    = 300
candidates     = [20, 50, 100, 200, 500]
gpu_util_floor = 0.40
